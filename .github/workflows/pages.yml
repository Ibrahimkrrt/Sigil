# Deploys the public CV only to GitHub Pages.
# The Studio editor is local only (`npm start`, then /studio) and is never part of this build.
name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build public CV
        run: npx ng build --configuration public --base-href "/${{ github.event.repository.name }}/"

      - name: Guard against Studio code in the public build
        run: |
          if grep -rlE 'Sigil Studio|studio-page|st-panel' dist/public/browser; then
            echo "::error::Studio code found in the public build"
            exit 1
          fi
          if [ -e dist/public/browser/export ]; then
            echo "::error::export directory found in the public build"
            exit 1
          fi

      - name: Prepare SPA fallback and disable Jekyll
        run: |
          cp dist/public/browser/index.html dist/public/browser/404.html
          touch dist/public/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
