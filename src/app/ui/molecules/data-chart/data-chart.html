@if (chart().title) {
  <figcaption class="chart__title">{{ chart().title }}</figcaption>
}
<div class="chart__scroll">
  <svg class="chart__svg" role="img" [attr.viewBox]="'0 0 ' + chart().width + ' ' + chart().height" [attr.aria-label]="chart().summary">
    @for (tick of chart().ticks; track $index) {
      <line class="chart__grid" [attr.x1]="chart().left" [attr.x2]="chart().width - chart().right" [attr.y1]="tick.y" [attr.y2]="tick.y" />
      <text class="chart__tick" text-anchor="end" [attr.x]="chart().left - 8" [attr.y]="tick.y + 4">{{ tick.label }}</text>
    }
    @if (chart().kind === 'line') {
      <polyline class="chart__line" [attr.points]="chart().line" />
    }
    @for (point of chart().points; track $index) {
      @if (chart().kind === 'bar') {
        <rect class="chart__bar" rx="6" [attr.x]="point.x - chart().barWidth / 2" [attr.y]="point.y" [attr.width]="chart().barWidth" [attr.height]="max(1, chart().base - point.y)" />
        <text class="chart__val" text-anchor="middle" [attr.x]="point.x" [attr.y]="point.y - 8">{{ point.value }}</text>
      } @else {
        <circle class="chart__dot" r="6" [attr.cx]="point.x" [attr.cy]="point.y" />
        <text class="chart__val" text-anchor="middle" [attr.x]="point.x" [attr.y]="point.y - 14">{{ point.value }}</text>
      }
      <text class="chart__tick" text-anchor="middle" [attr.x]="point.x" [attr.y]="chart().height - 12">{{ point.label }}</text>
    }
  </svg>
</div>
<details class="chart__data">
  <summary>{{ 'View the data as a table' | t }}</summary>
  <div class="chart__scroll">
    <table class="chart__table">
      <thead>
        <tr>
          <th scope="col">{{ chart().xLabel || ('Label' | t) }}</th>
          <th scope="col">{{ chart().unit ? ('Value ({unit})' | t: { unit: chart().unit }) : ('Value' | t) }}</th>
        </tr>
      </thead>
      <tbody>
        @for (point of chart().points; track $index) {
          <tr><th scope="row">{{ point.label }}</th><td>{{ point.value }}</td></tr>
        }
      </tbody>
    </table>
  </div>
</details>
